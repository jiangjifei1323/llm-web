# 问答助手全栈编排：FastAPI 后端 + Nginx 前端
# 复用已存在的 PostgreSQL 容器：把后端与 postgres 放进同一个自定义网络 llmnet，
# 后端直接用容器名 postgres:5432 连接（跨容器走内部端口，不绕宿主机）。
# 前置步骤（只需一次）：
#   docker network create llmnet
#   docker network connect llmnet postgres
# 用法：docker compose up -d --build  然后访问 http://localhost:8080
services:
  backend:
    build: ./backend
    # 其余环境变量（LLM_* / JWT_*）以镜像内 backend/.env 为准（已 COPY 进 /app/.env）；
    # DATABASE_URL 与此处网络相关，由 compose 覆盖为容器名寻址。
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:123456@postgres:5432/llm_db
    networks:
      - llmnet
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    networks:
      - llmnet
    ports:
      - "8080:80"

networks:
  llmnet:
    external: true
