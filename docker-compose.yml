# 问答助手全栈编排：PostgreSQL + FastAPI 后端 + Nginx 前端
# 用法：docker compose up -d --build  然后访问 http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: llm_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不向宿主机发布端口：后端经 Docker 内部网络访问 db，
    # 也避免与本机已运行的 PostgreSQL(5432) 冲突。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      # 主机名用服务名 db，而非 127.0.0.1
      DATABASE_URL: postgresql+psycopg://postgres:123456@db:5432/llm_db
      JWT_SECRET: change-me-in-production
      JWT_EXPIRE_HOURS: "24"
      # 未配置 LLM_API_KEY 时后端返回 mock 回答；填入真实 Key 即接入大模型
      LLM_API_KEY: ""
      LLM_BASE_URL: https://api.deepseek.com/v1
      LLM_MODEL: deepseek-chat
      LLM_TEMPERATURE: "0.7"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
